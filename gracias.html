<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaori – ¡Gracias por tu compra!</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: #faf8f5; color: #2d1b69; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    .card { background: white; border-radius: 1.5rem; padding: 3rem 2rem; text-align: center; max-width: 480px; width: 100%; border: 1px solid #f3e8ff; box-shadow: 0 8px 40px rgba(124,58,237,0.1); animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .success-circle { width: 88px; height: 88px; border-radius: 50%; background: linear-gradient(135deg, #dcfce7, #bbf7d0); display: flex; align-items: center; justify-content: center; font-size: 2.8rem; margin: 0 auto 1.5rem; box-shadow: 0 8px 24px rgba(22,163,74,0.2); }
    h1 { font-size: 2rem; color: #4c1d95; margin-bottom: 0.75rem; font-weight: 400; }
    p  { color: #6b7280; font-size: 0.95rem; line-height: 1.7; margin-bottom: 0.5rem; }
    .order-box { background: #faf5ff; border: 1px solid #e9d5ff; border-radius: 0.75rem; padding: 1rem; margin: 1.5rem 0; }
    .order-box p { font-size: 0.78rem; color: #6b7280; margin-bottom: 0.3rem; }
    .order-box strong { font-size: 0.95rem; color: #4c1d95; font-family: monospace; }
    .btns { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem; }
    .btn-primary { background: linear-gradient(135deg,#7c3aed,#6d28d9); color: white; padding: 0.9rem 2rem; border-radius: 9999px; font-weight: 700; font-family: 'Nunito', sans-serif; font-size: 0.95rem; text-decoration: none; display: block; transition: all 0.2s; }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-outline { border: 2px solid #e9d5ff; color: #7c3aed; padding: 0.9rem 2rem; border-radius: 9999px; font-weight: 600; font-family: 'Nunito', sans-serif; font-size: 0.95rem; text-decoration: none; display: block; transition: all 0.2s; }
    .btn-outline:hover { background: #f3e8ff; }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; letter-spacing: 0.2em; color: #4c1d95; margin-bottom: 2rem; text-decoration: none; display: block; }
  </style>
</head>
<body>
  <a href="index.html" class="logo">KAORI</a>
  <div class="card">
    <div class="success-circle">🛍️</div>
    <h1>¡Pago completado!</h1>
    <p>Gracias por tu compra. Hemos recibido tu pedido y lo estamos preparando con mucho cariño.</p>
    <p>Recibirás un email de confirmación en breve.</p>
    <div class="order-box">
      <p>Número de pedido</p>
      <strong id="orderId">—</strong>
    </div>
    <div class="btns">
      <a href="shop.html"  class="btn-primary">Seguir comprando →</a>
      <a href="index.html" class="btn-outline">Volver al inicio</a>
    </div>
  </div>

  <script>
    // Limpiar carrito
    localStorage.removeItem('kaori_cart');

    // Mostrar número de pedido si viene en la URL
    const params  = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id');
    if (orderId) {
      document.getElementById('orderId').textContent = '#' + orderId.slice(0,8).toUpperCase();
    }
  </script>
</body>
</html>
