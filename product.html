<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaori – Producto</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream:#faf8f5; --cream2:#f5f0ff; --dark:#2e0854; --dark2:#1e0a3c;
      --primary:#7c3aed; --primary2:#6d28d9; --light:#f3e8ff; --light2:#ede9fe;
      --muted:#6b7280; --text:#2d1b69; --white:#ffffff; --border:#e9d5ff; --pink:#ec4899;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--text);overflow-x:hidden}
    h1,h2,h3,h4{font-family:'Cormorant Garamond',serif}
    a{text-decoration:none;color:inherit}

    /* ── NAVBAR ── */
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 3rem;height:80px;background:rgba(250,248,245,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:all 0.4s}
    nav.scrolled{height:64px;box-shadow:0 4px 30px rgba(124,58,237,0.08)}
    .nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.7rem;letter-spacing:0.3em;color:var(--dark);font-weight:400;text-transform:uppercase}
    .nav-links{display:flex;gap:2.5rem}
    .nav-links a{font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:500;transition:color 0.3s;position:relative}
    .nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:1px;background:var(--primary);transform:scaleX(0);transition:transform 0.3s;transform-origin:left}
    .nav-links a:hover{color:var(--primary)}
    .nav-links a:hover::after{transform:scaleX(1)}
    .nav-right{display:flex;align-items:center;gap:0.75rem}
    .nav-btn-cuenta{font-size:0.75rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--primary);font-weight:600;padding:0.5rem 1.2rem;border:1px solid var(--border);border-radius:9999px;transition:all 0.3s;background:white;font-family:'Nunito',sans-serif}
    .nav-btn-cuenta:hover{background:var(--light);border-color:var(--primary)}
    .nav-cart-wrap{position:relative}
    .nav-cart-btn{background:var(--primary);color:white;border:none;padding:0.55rem 1.4rem;border-radius:9999px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:0.75rem;font-weight:700;transition:all 0.3s;display:flex;align-items:center;gap:0.5rem}
    .nav-cart-btn:hover{background:var(--primary2);transform:translateY(-1px)}
    .cart-count-badge{position:absolute;top:-6px;right:-6px;background:var(--pink);color:white;font-size:0.6rem;font-weight:700;width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center}
    .hamburger{display:none;background:none;border:none;cursor:pointer;padding:0.5rem;flex-direction:column;gap:5px}
    .hamburger span{display:block;width:22px;height:2px;background:var(--dark);border-radius:2px}
    .mobile-menu{display:none;position:fixed;top:80px;left:0;right:0;background:white;border-bottom:1px solid var(--border);padding:1.5rem 2rem;z-index:99;flex-direction:column;box-shadow:0 8px 30px rgba(124,58,237,0.08)}
    .mobile-menu a{font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text);font-weight:600;padding:0.9rem 0;border-bottom:1px solid var(--border);display:block}
    .mobile-menu a:last-child{border-bottom:none}
    .mobile-menu.open{display:flex}

    /* ── LOADING ── */
    .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;padding-top:80px}
    .spinner{width:40px;height:40px;border:2px solid var(--light);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── NOT FOUND ── */
    .not-found{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;padding-top:80px;flex-direction:column;gap:1rem}
    .not-found .icon{font-size:4rem;opacity:0.3}
    .not-found h2{font-size:2.5rem;color:var(--dark);font-weight:300}
    .not-found p{color:var(--muted);font-size:0.95rem;margin-bottom:1.5rem}
    .btn-back{display:inline-block;background:var(--primary);color:white;padding:0.9rem 2rem;border-radius:9999px;font-weight:700;font-family:'Nunito',sans-serif;font-size:0.82rem}

    /* ── PAGE ── */
    .product-page{max-width:80rem;margin:0 auto;padding:6rem 1.5rem 5rem;opacity:0;animation:fadeIn 0.6s ease 0.1s forwards}
    @keyframes fadeIn{to{opacity:1}}

    /* ── BREADCRUMB ── */
    .breadcrumb{display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;color:var(--muted);margin-bottom:2.5rem;flex-wrap:wrap}
    .breadcrumb a{color:var(--primary);transition:color 0.2s}
    .breadcrumb a:hover{color:var(--dark)}
    .breadcrumb span{color:var(--border)}

    /* ── GRID ── */
    .product-grid{display:grid;gap:4rem;margin-bottom:5rem}
    @media(min-width:1024px){.product-grid{grid-template-columns:1fr 1fr;gap:5rem}}

    /* ── GALERÍA ── */
    .main-img{aspect-ratio:1;overflow:hidden;border-radius:1rem;background:var(--light);position:relative;cursor:zoom-in;box-shadow:0 8px 40px rgba(124,58,237,0.1)}
    .main-img img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s ease, opacity 0.4s ease}
    .main-img:hover img{transform:scale(1.04)}
    .main-img img.changing{opacity:0;transform:scale(0.97)}
    .img-badges{position:absolute;top:1rem;left:1rem;display:flex;flex-direction:column;gap:0.4rem;z-index:2}
    .img-badge{font-size:0.62rem;font-weight:700;padding:4px 10px;border-radius:9999px;font-family:'Nunito',sans-serif}
    .badge-disc{background:var(--pink);color:white}
    .badge-feat{background:var(--primary);color:white}
    .badge-aroma{background:rgba(46,8,84,0.85);color:#e9d5ff;backdrop-filter:blur(4px)}

    /* ── INFO ── */
    .product-info{display:flex;flex-direction:column;gap:1.75rem}
    .prod-eyebrow{font-size:0.65rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--primary);font-weight:600;font-family:'Nunito',sans-serif}
    .prod-name{font-size:clamp(2rem,4vw,3rem);color
